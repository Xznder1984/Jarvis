[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — personal desktop AI assistant"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
cpal = "0.15"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
opt-level = 3
strip = true
